name: Validate source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  apple-build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Validate project structure
        run: python3 scripts/validate_structure.py
      - name: Validate local game packager
        run: python3 scripts/test_package_game.py
      - name: Test menu state and configuration
        run: swift test
      - name: Build the iOS simulator demo
        run: >-
          xcodebuild
          -project Examples/ZuchiniDemo/ZuchiniDemo.xcodeproj
          -scheme ZuchiniDemo
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - name: Build the unsigned iPhone demo
        run: >-
          xcodebuild
          -project Examples/ZuchiniDemo/ZuchiniDemo.xcodeproj
          -scheme ZuchiniDemo
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - name: Package standalone demo builds
        run: |
          mkdir -p build/Payload
          ditto DerivedData/Build/Products/Release-iphoneos/ZuchiniDemo.app build/Payload/ZuchiniDemo.app
          ditto -c -k --keepParent build/Payload build/ZuchiniDemo-unsigned.ipa
          ditto -c -k --keepParent DerivedData/Build/Products/Debug-iphonesimulator/ZuchiniDemo.app build/ZuchiniDemo-simulator.zip
      - name: Build experimental game runtime library
        run: bash scripts/build-native.sh
      - name: Upload runtime library
        uses: actions/upload-artifact@v4
        with:
          name: Zucchini-game-runtime
          path: |
            build/native/Monite.dylib
            build/native/dependencies.txt
            build/native/SHA256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Launch menu in an iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for group in data["devices"].values() for d in group if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE_ID" DerivedData/Build/Products/Debug-iphonesimulator/ZuchiniDemo.app
          xcrun simctl launch "$DEVICE_ID" com.example.zuchini.demo
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot build/ZuchiniDemo-launch.png
          xcrun simctl terminate "$DEVICE_ID" com.example.zuchini.demo
      - name: Upload demo builds
        uses: actions/upload-artifact@v4
        with:
          name: ZuchiniDemo-builds
          path: |
            build/ZuchiniDemo-unsigned.ipa
            build/ZuchiniDemo-simulator.zip
            build/ZuchiniDemo-launch.png
          if-no-files-found: error
          retention-days: 14
